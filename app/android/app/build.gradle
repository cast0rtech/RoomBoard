}

android {
    namespace = "com.roomboard.app"
    compileSdk = 34
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    defaultConfig {
        applicationId = "com.roomboard.app"
        minSdk = 21
        targetSdk = 34
        versionCode = flutter.versionCode
